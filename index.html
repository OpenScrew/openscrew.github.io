<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OpenScrew Foundation</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #fff;
            color: #000;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            height: 100vh;

            padding: 4vh 4vw;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        /* =================================
           WORK IN PROGRESS
        ================================= */

        .wip {
            width: 100%;

            font-family: "Anton", Impact, sans-serif;

            font-size: clamp(90px, 16vw, 270px);

            line-height: 0.86;

            letter-spacing: -0.025em;

            text-transform: uppercase;

            transform: scaleY(1.22);
            transform-origin: center;

            user-select: none;
        }

        .line {
            display: block;
            white-space: nowrap;
        }

        .line.work {
            text-align: left;
        }

        .line.progress {
            text-align: right;
        }


        /* =================================
           FOUNDATION
        ================================= */

        .bottom {
            width: 100%;

            margin-top: 7vh;

            padding-top: 15px;

            border-top: 2px solid #000;

            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .foundation {
            font-family: Arial, Helvetica, sans-serif;

            font-size: clamp(18px, 2vw, 30px);

            font-weight: 700;

            letter-spacing: -0.045em;
        }

        .year {
            font-family: monospace;

            font-size: 11px;

            letter-spacing: 0.08em;
        }


        /* =================================
           DESKTOP HEIGHT ADJUSTMENT
        ================================= */

        @media (min-width: 900px) and (min-height: 700px) {

            .wip {
                font-size: min(16vw, 250px);
                transform: scaleY(1.28);
            }

            .bottom {
                margin-top: 8vh;
            }
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .page {
                padding: 5vw;
            }

            .wip {
                font-size: 20vw;
                line-height: 0.88;

                white-space: normal;

                transform: scaleY(1.15);
            }

            .line {
                white-space: normal;
            }

            .line.work,
            .line.progress {
                text-align: left;
            }

            .bottom {
                margin-top: 9vh;
                padding-top: 12px;
            }

            .foundation {
                font-size: 5vw;
            }

            .year {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="wip">

            <div class="line work">
                WORK IN
            </div>

            <div class="line progress">
                PROGRESS
            </div>

        </section>


        <footer class="bottom">

            <div class="foundation">
                OpenScrew Foundation
            </div>

            <div class="year">
                2026
            </div>

        </footer>

    </main>

</body>
</html>
