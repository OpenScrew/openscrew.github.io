```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OpenScrew Foundation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #fff;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            min-height: 100vh;
            width: 100%;

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding: 4vw;
        }

        /* ─────────────────────────────
           MASSIVE TYPE
        ───────────────────────────── */

        .wip {
            width: 100%;

            font-family:
                Impact,
                "Arial Black",
                Arial,
                sans-serif;

            font-size: clamp(
                80px,
                15.2vw,
                250px
            );

            font-weight: 900;
            line-height: 0.78;

            letter-spacing: -0.075em;

            text-transform: uppercase;

            white-space: nowrap;
        }

        .wip .line {
            display: block;
        }

        .wip .line:first-child {
            margin-left: -0.25vw;
        }

        .wip .line:last-child {
            margin-left: 7vw;
        }

        /* ─────────────────────────────
           FOUNDATION NAME
        ───────────────────────────── */

        .foundation {
            margin-top: 4.5vw;

            padding-top: 1.2vw;

            border-top: 3px solid #000;

            display: flex;
            justify-content: space-between;
            align-items: baseline;

            font-size: clamp(16px, 2vw, 30px);

            font-weight: 700;

            letter-spacing: -0.035em;
            text-transform: uppercase;
        }

        .foundation span:last-child {
            font-family: monospace;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 0.08em;
        }

        /* ─────────────────────────────
           MOBILE
        ───────────────────────────── */

        @media (max-width: 700px) {

            .page {
                padding: 6vw 5vw;
            }

            .wip {
                font-size: 20vw;
                line-height: 0.8;

                white-space: normal;
            }

            .wip .line:first-child,
            .wip .line:last-child {
                margin-left: 0;
            }

            .foundation {
                margin-top: 8vw;
                padding-top: 3vw;

                font-size: 5vw;
            }

            .foundation span:last-child {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="wip">
            <div class="line">WORK IN</div>
            <div class="line">PROGRESS</div>
        </div>

        <div class="foundation">
            <span>OpenScrew Foundation</span>
            <span>2026</span>
        </div>

    </main>

</body>
</html>
```
